[package]
name = "threathud-broadcast-parser"
version = "0.2.0"
edition = "2024"
description = "Deadlock Threat HUD dynamic live player-damage parser"
license = "MIT"
publish = false

[[bin]]
name = "ThreatHudBroadcastParser"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.102"
bytes = "=1.11.1"
haste = { git = "https://github.com/deadlock-api/haste.git", rev = "77e8c5ac10b6ac64dd64c0d19455243de8bc1a92", features = ["async"] }
http = "=1.5.0"
reqwest = { version = "=0.13.2", features = ["http2", "gzip"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.18"
tokio = { version = "=1.50.0", features = ["macros", "rt-multi-thread", "sync"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"
